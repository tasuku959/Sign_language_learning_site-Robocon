<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>手話学習サイト</title>
  <link rel="stylesheet" href="style(2).css">
</head>

<body>

  <header>
    <div class="container header-inner">

      <p class="inquiry">おといあわせ</p>

      <div class="language-switching">
        <button type="button"
        class="language-button active"
        id="sign-button">しゅわ</button>

        <button type="button" class="language-button" id="finger-button">ゆびもじ</button>
      </div>

    </div>
  </header>


<!-- =========================
     しゅわページ
========================= -->
<div id="sign-page">
  <main>

    <div class="container main-container">

      <!-- 左側 -->
      <section class="learning-area">

        <!-- =========================
           しゅわ：最初の案内画面
        ========================= -->
        <div
          class="category-guide"
          id="sign-category-guide">

          <!-- セリフ -->
          <div class="guide-speech">

            <img
              src="images/吹き出し.png"
              alt=""
              class="guide-speech-image">

            <p class="guide-message">
              やってみたいしゅわを<br>
              えらんでね！😊
            </p>

          </div>


          <!-- たすくイラスト -->
          <img
            src="images/たすくイラスト化.png"
            alt="カテゴリーをえらんでね"
            class="guide-character">

        </div>

        <!-- しらべる・クイズ切り替えボタン -->
        <div class="mode-switch" data-category="ロボコンでよくつかうしゅわ">

          <button
            type="button"
            class="mode-button active"
            id="search-button">
            しらべる
          </button>

          <button
            type="button"
            class="mode-button"
            id="quiz-button">
            クイズ
          </button>

          <!-- しゅわ検索エリア -->
          <!-- 検索 -->
          <div class="search-area">

            <input
              type="text"
              id="sign-search-input"
              placeholder="しゅわを けんさく">

            <button
              type="button"
              id="sign-search-button">
              けんさく
            </button>

          </div>

        </div>


        <!-- =========================
            しゅわページ
        ========================= -->
        <!-- =========================
             調べるモード
        ========================== -->

        <div
          class="learning-screen"
          id="search-screen">

          <p class="subtitle">
            がめんを おすと、<br>
            しゅわの どうがが はじまるよ！
          </p>

          <div class="item-contents">
          </div>

        </div>


        <!-- =========================
            しゅわページ
        ========================= -->
        <!-- =========================
             クイズモード
        ========================== -->

        <div
          class="quiz-screen"
          id="quiz-screen">

          <p class="subtitle">
            したのどうがの しゅわをみて、
            なまえをいれてね😊<br>
            【ちゅうい】ひらがなでいれてね！
          </p>


        <!-- =========================
            しゅわページ
        ========================= -->
        <!-- =========================
             クイズモード
        ========================== -->
        <div class="quiz-content">

          <!-- YouTube動画 -->
          <div
            class="quiz-video"
            id="quiz-video">
          </div>


          <!-- 回答入力 -->
          <div
            class="answer-area"
            id="quiz-answer-area">

            <input
              type="text"
              id="quiz-answer-input"
              placeholder="こたえを いれてね">

            <button
              type="button"
              id="quiz-answer-button">
              こたえる
            </button>

          </div>


          <!-- 正解を表示する場所 -->
          <p
            class="quiz-answer-title"
            id="quiz-answer-title">
          </p>


          <!-- 回答後に表示 -->
          <div
            class="quiz-after-buttons"
            id="quiz-after-buttons">

            <a
              href="#"
              class="view-results-button"
              id="view-results-button">
              けっかをみる
            </a>

            <a
              href="#"
              class="next-button"
              id="next-quiz-button">
              つぎへ
            </a>

          </div>

        </div>

        </div>

        <!-- 未完成カテゴリー用の案内画像 -->
        <div id="sign-incomplete-screen" class="sign-incomplete-screen" hidden>
          <img src="images/未完成ですごめんなさい.png" alt="まだつくっているとちゅうだよ！ちょっとまっててね">
        </div>

      </section>


      <!-- 右側カテゴリー -->

        <button class="category-item active"

          つかうしゅわ
